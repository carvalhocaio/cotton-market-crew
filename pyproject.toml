[project]
name = "cotton-market-crew"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai[google-genai]>=1.6.1",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "llm: testes que fazem chamadas reais de LLM (não rodam por padrão, exigem GEMINI_API_KEY)",
]
addopts = "-m 'not llm'"
